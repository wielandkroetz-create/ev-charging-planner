name: Trigger auto deployment for ev-charging-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ev-charging-api-AutoDeployTrigger-aaf7fa5c-f36f-433e-a507-69b4a9735a9f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.EVCHARGINGAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EVCHARGINGAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EVCHARGINGAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.EVCHARGINGAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.EVCHARGINGAPI_REGISTRY_PASSWORD }}
          containerAppName: ev-charging-api
          resourceGroup: rg-ev-charging-planner
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


